services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: tep-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: tep_db
      POSTGRES_USER: tep_user
      POSTGRES_PASSWORD: tep_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tep_user -d tep_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: tep-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://tep_user:tep_password@timescaledb:5432/tep_db
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: tep-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
